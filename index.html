<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Звіти партнерів</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 48px 32px;
    }

    header {
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1d1d1f;
    }

    header p {
      margin-top: 4px;
      color: #6e6e73;
      font-size: 0.88rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #d2d2d7;
      color: #6e6e73;
      font-size: 0.82rem;
    }

    .toolbar span { color: #1d1d1f; font-weight: 500; }

    .folder-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .folder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 12px 12px;
      border-radius: 12px;
      text-decoration: none;
      color: #1d1d1f;
      width: 120px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .folder:hover {
      background: rgba(0, 0, 0, 0.06);
    }

    .folder:active {
      background: rgba(0, 122, 255, 0.12);
    }

    .folder-icon {
      position: relative;
      width: 72px;
      height: 56px;
    }

    .folder-icon svg {
      width: 100%;
      height: 100%;
    }

    .folder-name {
      font-size: 0.78rem;
      text-align: center;
      line-height: 1.3;
      word-break: break-word;
      color: #1d1d1f;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
      right: 4px;
    }
    .dot-green { background: #34c759; }
    .dot-gray  { background: #aeaeb2; }
  </style>
</head>
<body>

  <header>
    <h1>📁 Звіти партнерів</h1>
    <p>Bolt Food · Poltava · Щотижневі звіти</p>
  </header>

    Папки: <span>7</span> &nbsp;·&nbsp; Оновлено: <span id="updated"></span>
  </div>

          <rect x="0" y="10" width="72" height="44" rx="6" fill="#FFD60A"/>
          <rect x="0" y="10" width="72" height="44" rx="6" fill="url(#g1)"/>
          <path d="M0 16C0 12.7 2.7 10 6 10H28L34 4H66C69.3 4 72 6.7 72 10V16H0Z" fill="#FFE34D"/>
          <defs>
            <linearGradient id="g1" x1="36" y1="10" x2="36" y2="54" gradientUnits="userSpaceOnUse">
              <stop stop-color="#FFE259"/>
              <stop offset="1" stop-color="#F5A623"/>
            </linearGradient>
          </defs>
