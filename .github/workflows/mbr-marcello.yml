name: MBR — MARCELLO

on:
  schedule:
    # 4-го числа кожного місяця о 13:00 Київ (EEST UTC+3 = 10:00 UTC).
    # До звіту додається щойно завершений місяць.
    - cron: '0 10 4 * *'
  workflow_dispatch:   # ручний запуск

permissions:
  contents: write

jobs:
  generate-mbr:
    name: Generate MBR MARCELLO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate MBR report
        env:
          DATABRICKS_HOST:       ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:      ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
        run: python "MBR Marcello/generate_mbr_marcello.py"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Маркетинговий план і glovo_findings.json скрипт не змінює,
          # але додаємо всю папку — якщо їх правили вручну, зміни не втратяться.
          git add "MBR Marcello/"
          git diff --staged --quiet || git commit -m "📊 MBR MARCELLO — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
