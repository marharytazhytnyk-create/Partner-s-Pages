name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Увага: коли Pages публікує довше за 10 хвилин, цей крок падає з таймауту,
      # хоча саме розгортання доходить до кінця і сайт оновлюється. Підняти межу
      # не можна — дія обмежує timeout десятьма хвилинами.
      - id: deployment
        uses: actions/deploy-pages@v4
