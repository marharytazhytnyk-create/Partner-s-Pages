name: Update NOA

on:
  schedule:
    # 4-го числа кожного місяця о 13:00 Київ (EEST UTC+3 = 10:00 UTC).
    # До звітів додається щойно завершений місяць.
    - cron: '0 10 4 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-noa:
    name: NOA — sales + MBR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate NOA reports
        env:
          DATABRICKS_HOST:       ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:      ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
        run: |
          python "NOA/generate_sales_noa.py"
          python "NOA/generate_mbr_noa.py"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "NOA/"
          git diff --staged --quiet || git commit -m "NOA — auto-update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
