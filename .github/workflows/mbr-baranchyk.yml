name: MBR — Той Самий Баранчик

on:
  schedule:
    # 3-го числа кожного місяця о 10:00 Київ (EEST UTC+3 = 07:00 UTC).
    # 4-го — резервний запуск на випадок, якщо 3-го дані ще не доїхали
    # або кластер Databricks був недоступний.
    - cron: '0 7 3 * *'
    - cron: '0 7 4 * *'
  workflow_dispatch:   # ручний запуск

permissions:
  contents: write

jobs:
  generate-mbr:
    name: Generate MBR Той Самий Баранчик
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Generate MBR report
        env:
          DATABRICKS_HOST:       ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:      ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
        run: python "MBR Той Самий Баранчик/generate_mbr_baranchyk.py"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "MBR Той Самий Баранчик/"
          git diff --staged --quiet || git commit -m "📊 MBR Той Самий Баранчик — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
