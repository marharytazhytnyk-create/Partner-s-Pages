<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIZONA — Звіти</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 48px 32px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .back {
      color: #007aff;
      text-decoration: none;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .back:hover { text-decoration: underline; }

    .header-info h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .header-info p {
      margin-top: 4px;
      color: #6e6e73;
      font-size: 0.88rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #d2d2d7;
      color: #6e6e73;
      font-size: 0.82rem;
    }

    .toolbar span { color: #1d1d1f; font-weight: 500; }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      color: #1d1d1f;
      transition: background 0.15s;
    }

    .file-row:hover { background: rgba(0,0,0,0.05); }

    .file-icon { font-size: 1.5rem; flex-shrink: 0; }

    .file-info { flex: 1; }
    .file-name { font-size: 0.95rem; font-weight: 500; }
    .file-meta { font-size: 0.78rem; color: #6e6e73; margin-top: 2px; }

    .file-arrow { color: #aeaeb2; font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>📁 ARIZONA</h1>
      <p>Bolt Food · Poltava · Щотижневі звіти</p>
    </div>
  </header>

  <div class="toolbar">
    Файли: <span>1</span>
  </div>

  <div class="file-list">

    <a class="file-row" href="WBR_Arizona.html">
      <div class="file-icon">📊</div>
      <div class="file-info">
        <div class="file-name">WBR Arizona</div>
        <div class="file-meta">Weekly Business Report · Bolt Food</div>
      </div>
      <div class="file-arrow">›</div>
    </a>

  </div>

</body>
</html>
