<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IZI BURGER — Звіти</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      padding: 48px 32px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .header-info h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .header-info p {
      margin-top: 4px;
      color: #6e6e73;
      font-size: 0.88rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #d2d2d7;
      color: #6e6e73;
      font-size: 0.82rem;
    }

    .toolbar span { color: #1d1d1f; font-weight: 500; }

    .empty {
      margin-top: 60px;
      text-align: center;
      color: #aeaeb2;
    }

    .empty div { font-size: 3rem; margin-bottom: 16px; }
    .empty p { font-size: 0.95rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>📁 IZI BURGER</h1>
      <p>Bolt Food · Poltava · Щотижневі звіти</p>
    </div>
  </header>

  <div class="toolbar">
    Файли: <span>0</span>
  </div>

  <div class="empty">
    <div>📂</div>
    <p>Звіти ще не додано</p>
  </div>

</body>
</html>
